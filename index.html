<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ogs_json_gui</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <!-- ==========================
       Left Column: Forms
       ========================== -->
  <div class="col form-col">
    <!-- Header with dropdown embedded -->
    <h3>
      <label>Form Type
        <select id="form_selector">
          <option value="ground">Ground Station Form</option>
          <option value="spacecraft">Spacecraft Form</option>
        </select>
      </label>
    </h3>

    <!-- ==========================
         Ground Station Form
         ========================== -->
    <div id="ground_station_form">
      <label>Name<input id="name" type="text"/></label>
      <label>Link Receivers<input id="link_receivers" type="number"/></label>
      <label>Handover Duration Seconds<input id="handover_duration_seconds" type="number"/></label>
      
      <label>Quality Determination Method
        <select id="quality_determination_method">
          <option value="" disabled selected>-select-</option>
          <option value="BEST_PROBABILITY">BEST_PROBABILITY</option>
          <option value="WORST_PROBABILITY">WORST_PROBABILITY</option>
          <option value="AVERAGE_PROBABILITY">AVERAGE_PROBABILITY</option>
          <option value="PERSISTENCE">PERSISTENCE</option>
          <option value="PERFECT">PERFECT</option>
        </select>
      </label>

      <label>Priority<input id="priority" type="number"/></label>
      <label>Cloud Threshold<input id="cloud_threshold" type="number" step="0.01"/></label>

      <div class="checkbox-line">
        <label>Current Conditions Enabled<input id="current_conditions_enabled" type="checkbox"/></label>
      </div>

      <label>Horizon Threshold Degrees<input id="horizon_threshold_degrees" type="number" step="0.1"/></label>
      <label>Downlink Rate Mbps<input id="downlink_rate_mbps" type="number" step="0.1"/></label>

      <label class="spaced-checkbox">Weather Constraints Enabled<input id="weather_constraints_enabled" type="checkbox"/></label>

      <fieldset id="weather_constraints_fieldset">
        <legend>Weather Constraints</legend>
        <label>Directory<input id="wc_directory" type="text"/></label>
        <label>Wildcard<input id="wc_wildcard" type="text"/></label>
        <label>Wind Threshold Knots<input id="wc_wind" type="number" step="0.1"/></label>
        <label>Temperature Threshold Fahrenheit<input id="wc_temp" type="number" step="0.1"/></label>
        <label>Relative Humidity Threshold Percent<input id="wc_rh" type="number" step="0.1"/></label>
      </fieldset>

      <fieldset>
        <legend>Current Conditions</legend>
        <label>Directory<input id="cc_directory" type="text"/></label>
        <label>Wildcard<input id="cc_wildcard" type="text"/></label>
        <label>Column Header<input id="cc_column_header" type="text"/></label>
      </fieldset>

      <h4>Forecasts</h4>
      <div id="forecasts"></div>
      <button id="add_forecast">Add Forecast</button>
    </div>

    <!-- ==========================
         Spacecraft Form
         ========================== -->
    <div id="spacecraft_form" style="display:none;">
      <label>Spacecraft Name<input id="sc_name" type="text" placeholder="Enter spacecraft name"/></label>
      <label>Orbit Type<input id="sc_orbit" type="text" placeholder="LEO, MEO, GEO"/></label>
      <label>Mass (kg)<input id="sc_mass" type="number" placeholder="Enter mass"/></label>
      <label>Power (W)<input id="sc_power" type="number" placeholder="Enter power capacity"/></label>
      <label>Payload<input id="sc_payload" type="text" placeholder="Payload type"/></label>
    </div>
  </div>

  <!-- ==========================
       Right Column: JSON Preview
       ========================== -->
  <div class="col">
    <h3>JSON Preview</h3>
    <pre id="preview">{}</pre>
    <button id="download">Download JSON</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
